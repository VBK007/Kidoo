plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'kido'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Schema migrations. ddl-auto built the schema until now, which cannot drop a
    // column, rename one, narrow a type or backfill data — and leaves no record of
    // what any given database has actually had done to it.
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Watch parties keep several devices on the same frame. A pause has to land on
    // every screen at once, which rules out polling: a two-second poll makes the other
    // rooms pause visibly late.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    runtimeOnly 'org.postgresql:postgresql'

    // Firebase Admin — verifies the ID token a phone gets from Google sign-in.
    // Only the verification half is used: the app still carries this server's
    // own JWT on every request after sign-in.
    implementation 'com.google.firebase:firebase-admin:9.4.1'

    // HTML parsing for the mymirror page extractor.
    implementation 'org.jsoup:jsoup:1.18.3'

    // Health and the /actuator/tokens endpoint for the mymirror token manager.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Claude, for the search box only. Optional at runtime: with app.media.ai.enabled
    // off (the default) or no API key set, nothing here is constructed and search falls
    // back to the rule-based parser, which is what a home server offline should do.
    implementation "com.anthropic:anthropic-java:2.34.0"

    // JWT (JJWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2' // in-memory DB for integration tests
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    inputs.property('recoveryWorkerFixture', providers.environmentVariable('KIDOO_TEST_WORKER_SOCKET').isPresent())
    useJUnitPlatform {
        // Timing-based load benchmarks are opt-in so they never flake the regression baseline.
        // Run them with: ./gradlew test -PrunBenchmarks --tests '*Benchmark'
        if (!project.hasProperty('runBenchmarks')) {
            excludeTags 'benchmark'
        }
    }
}

// Dev convenience: `./gradlew bootRun -Ph2 --args='--spring.profiles.active=h2'`
// runs the real server against in-memory H2 (no Docker/Postgres needed).
// Does not affect the normal Postgres build.
if (project.hasProperty('h2')) {
    dependencies {
        runtimeOnly 'com.h2database:h2'
    }
}

// Opt-in isolated-PostgreSQL acceptance leg for the mirror catalogue matrix.
// `./gradlew test -Ppg --tests '*Postgres*'` boots a throwaway embedded Postgres
// (zonky) so the matrix runs against the real postgresql Flyway tree, not just H2.
// Guarded by a property so the normal build never pulls the ~15MB binary.
if (project.hasProperty('pg')) {
    dependencies {
        testImplementation 'io.zonky.test:embedded-postgres:2.0.7'
        testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.2.0')
    }
} else {
    // The Postgres acceptance leg depends on the embedded-postgres library, which is only on the
    // classpath under -Ppg. Keep it out of the normal test compile so the default build stays green.
    tasks.named('compileTestJava') {
        exclude '**/MirrorCatalogueStorePostgresMatrixTest.java'
    }
}
