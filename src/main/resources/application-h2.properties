# Dev-only profile: run the server against in-memory H2 without Docker/Postgres.
# Activate with: ./gradlew bootRun -Ph2 --args='--spring.profiles.active=h2'
spring.datasource.url=jdbc:h2:mem:kido;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.docker.compose.enabled=false
