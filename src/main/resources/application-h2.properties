# Dev-only profile: run the server against in-memory H2 without Docker/Postgres.
# Activate with: ./gradlew bootRun -Ph2 --args='--spring.profiles.active=h2'
spring.datasource.url=jdbc:h2:mem:kido;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.docker.compose.enabled=false

# Flyway builds the schema here too, from the H2 half of db/migration, and Hibernate
# only validates it — the same arrangement the tests run under.
#
# Both lines are needed together. Without the location, this profile inherits
# classpath:db/migration/postgresql from application.properties and feeds PostgreSQL
# DDL to H2, which dies on V8 ("Constraint MEDIA_ITEMS_MEDIA_TYPE_CHECK not found"):
# the two dialects have separate directories precisely because one script cannot serve
# both. And once Flyway owns the schema, ddl-auto has to stop building one — the old
# create-drop would drop and rebuild the very tables the migrations had just created,
# leaving a history table describing a schema Hibernate had since replaced.
#
# validate also makes this run worth something beyond convenience: an entity added
# without a matching migration fails here, exactly as it would against Postgres.
spring.flyway.locations=classpath:db/migration/h2
spring.jpa.hibernate.ddl-auto=validate
