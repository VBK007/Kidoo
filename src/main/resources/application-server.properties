# Home-server profile — the real media libraries on the machine at 192.168.29.122.
#
# Activate with:
#   java -jar kido.jar --spring.profiles.active=server
#   ./gradlew bootRun --args='--spring.profiles.active=server'
#
# Kept in its own profile rather than in application.properties on purpose: a typed
# library list takes precedence over app.media.roots, so putting these paths in the
# default profile would override the temporary roots the integration tests configure
# and quietly break them. The default profile stays dormant; this one is the server.

# --- Libraries ---
# Paths are local to the server, because the app runs there. That matters: reading the
# disk over SMB from another machine would send every byte across the LAN twice
# (server to app host to phone) and make seeking noticeably worse.
app.media.libraries[0].name=Films
app.media.libraries[0].path=E:/Entertainment
app.media.libraries[0].type=FILM

# Add more as the disk grows. A type per root is how anime, home footage, music and
# photos get separated — nothing in a filename distinguishes them reliably.
#   app.media.libraries[1].name=Anime
#   app.media.libraries[1].path=E:/Entertainment/Anime
#   app.media.libraries[1].type=ANIME
#   app.media.libraries[2].name=Ours
#   app.media.libraries[2].path=E:/Home Videos
#   app.media.libraries[2].type=HOME_VIDEO

# --- Scanning ---
# Left off deliberately: a full scan of a large disk on every restart is a lot of IO
# and a lot of ffprobe processes. Trigger it explicitly instead:
#   POST /api/media/library/scan   with X-Admin-Key
app.media.scan-on-startup=false

# Probe during the scan so the catalog knows codecs up front. Costs one ffprobe per
# new file; set false for a fast first index and files are probed on first play instead.
app.media.probe-on-scan=true

# --- Thumbnail scrubbing ---
# On for the server, since the scrub preview is one of the things a local disk makes
# genuinely nice. Generation is still explicit per title (POST .../trickplay) and runs
# on one low-priority thread, so it never competes with playback.
app.media.trickplay.enabled=true

# --- Scratch space ---
# Both default to the system temp directory. Point them at a roomy, ideally fast disk:
# an unthrottled transcode can occupy a few GB per session until it is reaped.
# app.media.transcode-dir=E:/kido-cache/transcode
# app.media.trickplay.cache-dir=E:/kido-cache/trickplay

# Raise only if the server has cores to spare — each transcode saturates several.
app.media.max-transcode-sessions=2

# --- Reachability ---
# Spring Boot binds all interfaces by default, so the app is reachable on the LAN at
# http://192.168.29.122:8080 once a Windows Firewall inbound rule allows the port.
# The Android client needs cleartext HTTP permitted for that host, since Android 9+
# blocks plain HTTP by default.
server.port=8080

# Override these on the server rather than shipping real values in git.
# app.jwt.secret=...
# app.admin.api-key=...
