spring.application.name=kido
server.port=8080

# --- PostgreSQL ---
# In dev, spring-boot-docker-compose auto-starts compose.yaml and wires the
# datasource (a ConnectionDetails bean overrides the values below). These
# defaults match compose.yaml for manual/non-docker runs.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kido}
spring.datasource.username=${DB_USER:kido}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# Override app.jwt.secret in production (must be >= 32 chars for HS256).
app.jwt.secret=${JWT_SECRET:kido-dev-secret-change-me-please-0123456789-abcdefghijklmnop}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- Admin / billing ---
# Required (X-Admin-Key header) to publish content. Override in production.
app.admin.api-key=${ADMIN_API_KEY:kido-admin-dev-key}
# Purchase verification strategy: dev (accept any non-blank token) | google (verify with Play).
app.billing.verify=${BILLING_VERIFY:dev}

# --- Google sign-in (optional) ---
# Path to a Firebase service-account JSON, or the JSON itself. Used only to
# verify ID tokens the app receives from Google; the session that follows is
# this server's own JWT, exactly as with a password login.
#
# Unset means the feature is off and /api/auth/firebase answers 501 — a home
# media server should not need a Google project in order to start.
#
# The key grants admin access to the Firebase project and must never be
# committed; secrets/ is gitignored. In Docker, mount it and point
# FIREBASE_CREDENTIALS at the path inside the container.
app.firebase.credentials=${FIREBASE_CREDENTIALS:secrets/firebase-service-account.json}

# --- Logging ---
logging.level.root=INFO
logging.level.com.example.kido=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %cyan(%logger{28}) - %msg%n
# Write logs to file as well as the console (rolls daily / at 10MB).
logging.file.name=logs/kido.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# --- Jackson ---
# Missing JSON primitives default to 0, so a partial offline sync payload
# (omitting unchanged fields) merges cleanly instead of 500-ing.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- Media library (home-server movie streaming) ---
# Comma-separated absolute directories to index. Empty means the module stays
# dormant: the catalog is simply empty and nothing else changes.
app.media.roots=${MEDIA_ROOTS:}
# ffmpeg/ffprobe are external binaries. Bare names resolve via PATH; set an absolute
# path if they are not installed system-wide.
app.media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
app.media.ffprobe-path=${FFPROBE_PATH:ffprobe}
# Probing during a scan is accurate but costs a process per file. Turn it off for a
# fast first index; files are then probed lazily on first playback instead.
app.media.probe-on-scan=true
app.media.probe-timeout-seconds=30
app.media.scan-on-startup=false
# Minutes between automatic re-scans that pick up new files with nobody triggering a
# scan by hand. 0 disables it (default) — scan-on-startup and the admin endpoint are
# then the only ways to index new media.
app.media.scan-interval-minutes=0
# Skips trailers and sample clips that sit beside the feature. 0 disables.
app.media.min-file-size-mb=50
# HLS scratch space. Wiped at startup and as sessions are reaped.
app.media.transcode-dir=${MEDIA_TRANSCODE_DIR:${java.io.tmpdir}/kido-transcode}
app.media.transcode-idle-timeout-seconds=120
# Each transcode saturates several cores, so keep this low on a home server.
app.media.max-transcode-sessions=2
app.media.transcode-crf=21
app.media.transcode-preset=veryfast
app.media.hls-segment-seconds=6

# --- Thumbnail scrubbing (sprite sheets) ---
# Generating these decodes the whole file, so it is opt-in and runs as an explicit
# background job rather than during a scan.
app.media.trickplay.enabled=${TRICKPLAY_ENABLED:false}
app.media.trickplay.interval-seconds=10
app.media.trickplay.tile-width=320
app.media.trickplay.columns=10
app.media.trickplay.rows=10
app.media.trickplay.quality=5
app.media.trickplay.cache-dir=${TRICKPLAY_DIR:${java.io.tmpdir}/kido-trickplay}
app.media.trickplay.timeout-minutes=30

# --- Example: the home server at 192.168.29.122 ---
# Set MEDIA_ROOTS, or replace these with typed libraries. Paths are as seen by the
# machine actually running this app, which should be the server itself: reading the
# disk over SMB from another box sends every byte across the LAN twice and makes
# seeking noticeably worse.
#
#   app.media.libraries[0].name=Films
#   app.media.libraries[0].path=E:/Entertainment/Movies
#   app.media.libraries[0].type=FILM
#   app.media.libraries[1].name=Anime
#   app.media.libraries[1].path=E:/Entertainment/Anime
#   app.media.libraries[1].type=ANIME
#   app.media.libraries[2].name=Ours
#   app.media.libraries[2].path=E:/Entertainment/Home Videos
#   app.media.libraries[2].type=HOME_VIDEO
#
# If the app does run elsewhere, a UNC path works too:
#   app.media.libraries[0].path=//192.168.29.122/Entertainment/Movies

# --- Offline downloads ---
# A copy is only re-encoded when the original will not do; a file the device can
# already play is handed over untouched. Conversions use a slower preset than live
# transcoding, since nothing waits on them frame-by-frame and a smaller file is the
# entire point when the destination is a phone.
app.media.downloads.enabled=${DOWNLOADS_ENABLED:true}
app.media.downloads.dir=${DOWNLOADS_DIR:${java.io.tmpdir}/kido-downloads}
app.media.downloads.retention-hours=72
app.media.downloads.max-queued-per-profile=5
app.media.downloads.preset=medium
app.media.downloads.crf=23
app.media.downloads.timeout-minutes=240
app.media.downloads.default-height=720
