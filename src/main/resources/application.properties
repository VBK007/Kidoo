spring.application.name=kido
server.port=8080

# --- PostgreSQL ---
# In dev, spring-boot-docker-compose auto-starts compose.yaml and wires the
# datasource (a ConnectionDetails bean overrides the values below). These
# defaults match compose.yaml for manual/non-docker runs.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kido}
spring.datasource.username=${DB_USER:kido}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# Override app.jwt.secret in production (must be >= 32 chars for HS256).
app.jwt.secret=${JWT_SECRET:kido-dev-secret-change-me-please-0123456789-abcdefghijklmnop}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- Admin / billing ---
# Required (X-Admin-Key header) to publish content. Override in production.
app.admin.api-key=${ADMIN_API_KEY:kido-admin-dev-key}
# Purchase verification strategy: dev (accept any non-blank token) | google (verify with Play).
app.billing.verify=${BILLING_VERIFY:dev}

# --- Logging ---
logging.level.root=INFO
logging.level.com.example.kido=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %cyan(%logger{28}) - %msg%n
# Write logs to file as well as the console (rolls daily / at 10MB).
logging.file.name=logs/kido.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# --- Jackson ---
# Missing JSON primitives default to 0, so a partial offline sync payload
# (omitting unchanged fields) merges cleanly instead of 500-ing.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- Media library (home-server movie streaming) ---
# Comma-separated absolute directories to index. Empty means the module stays
# dormant: the catalog is simply empty and nothing else changes.
app.media.roots=${MEDIA_ROOTS:}
# ffmpeg/ffprobe are external binaries. Bare names resolve via PATH; set an absolute
# path if they are not installed system-wide.
app.media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
app.media.ffprobe-path=${FFPROBE_PATH:ffprobe}
# Probing during a scan is accurate but costs a process per file. Turn it off for a
# fast first index; files are then probed lazily on first playback instead.
app.media.probe-on-scan=true
app.media.probe-timeout-seconds=30
app.media.scan-on-startup=false
# Skips trailers and sample clips that sit beside the feature. 0 disables.
app.media.min-file-size-mb=50
# HLS scratch space. Wiped at startup and as sessions are reaped.
app.media.transcode-dir=${MEDIA_TRANSCODE_DIR:${java.io.tmpdir}/kido-transcode}
app.media.transcode-idle-timeout-seconds=120
# Each transcode saturates several cores, so keep this low on a home server.
app.media.max-transcode-sessions=2
app.media.transcode-crf=21
app.media.transcode-preset=veryfast
app.media.hls-segment-seconds=6
