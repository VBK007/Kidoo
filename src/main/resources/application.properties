spring.application.name=kido
server.port=8080

# --- PostgreSQL ---
# In dev, spring-boot-docker-compose auto-starts compose.yaml and wires the
# datasource (a ConnectionDetails bean overrides the values below). These
# defaults match compose.yaml for manual/non-docker runs.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kido}
spring.datasource.username=${DB_USER:kido}
spring.datasource.password=${DB_PASSWORD:secret}
# Hibernate checks the schema against the entities and refuses to start on a mismatch;
# it no longer changes it. Flyway owns the schema — see db/migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Schema migrations ---
# An existing database built by the old ddl-auto=update has the baseline schema already
# but no history table. baseline-on-migrate stamps V1 as applied for those and starts
# them at V2; an empty database runs V1 like any other migration. Without it, Flyway
# refuses to touch a non-empty schema it has no record of.
# One baseline per dialect: a @Lob String is oid here and clob on H2, and the enum
# columns differ too, so a single directory cannot validate against both. Pinning the
# location also stops Flyway recursing into db/migration and finding two V1s.
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JWT ---
# Override app.jwt.secret in production (must be >= 32 chars for HS256).
app.jwt.secret=${JWT_SECRET:kido-dev-secret-change-me-please-0123456789-abcdefghijklmnop}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
# How long a refresh token stays good (30 days). It is rotated on every use, so this
# is how long a device may be idle before its owner has to type a password again, not
# how long any one value lives. Lower app.jwt.expiration-ms once every client refreshes:
# a short-lived access token is the whole point of having this, but shortening it while
# an older build is still in the wild would sign those devices out mid-week.
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# --- Admin / billing ---
# Required (X-Admin-Key header) to publish content. Override in production.
app.admin.api-key=${ADMIN_API_KEY:kido-admin-dev-key}
# The read-only database browser under /api/admin/db — every table, a page at a
# time, behind the same owner gate as the rest of the admin surface. It never
# returns a password or token hash, masks email addresses and IPs until a single
# row is opened, and has no code path that writes. It is still the widest read
# surface here, so it is one switch to remove entirely.
app.admin.db-browser.enabled=${ADMIN_DB_BROWSER:true}
# Purchase verification strategy: dev (accept any non-blank token) | google (verify with Play).
app.billing.verify=${BILLING_VERIFY:dev}

# --- Google sign-in (optional) ---
# Path to a Firebase service-account JSON, or the JSON itself. Used only to
# verify ID tokens the app receives from Google; the session that follows is
# this server's own JWT, exactly as with a password login.
#
# Unset means the feature is off and /api/auth/firebase answers 501 — a home
# media server should not need a Google project in order to start.
#
# The key grants admin access to the Firebase project and must never be
# committed; secrets/ is gitignored. In Docker, mount it and point
# FIREBASE_CREDENTIALS at the path inside the container.
app.firebase.credentials=${FIREBASE_CREDENTIALS:secrets/firebase-service-account.json}

# --- Logging ---
logging.level.root=INFO
logging.level.com.example.kido=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %cyan(%logger{28}) - %msg%n
# Write logs to file as well as the console (rolls daily / at 10MB).
logging.file.name=logs/kido.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# --- Uploads ---
# Spring defaults to 1MB per file, which a poster exceeds routinely. The request
# ceiling leaves room for a poster and a backdrop in the same call.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# --- Jackson ---
# Missing JSON primitives default to 0, so a partial offline sync payload
# (omitting unchanged fields) merges cleanly instead of 500-ing.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- Media library (home-server movie streaming) ---
# Comma-separated absolute directories to index. Empty means the module stays
# dormant: the catalog is simply empty and nothing else changes.
app.media.roots=${MEDIA_ROOTS:}
# ffmpeg/ffprobe are external binaries. Bare names resolve via PATH; set an absolute
# path if they are not installed system-wide.
app.media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
app.media.ffprobe-path=${FFPROBE_PATH:ffprobe}
# Probing during a scan is accurate but costs a process per file. Turn it off for a
# fast first index; files are then probed lazily on first playback instead.
app.media.probe-on-scan=true
app.media.probe-timeout-seconds=30
app.media.scan-on-startup=false
# Minutes between automatic re-scans that pick up new files with nobody triggering a
# scan by hand. 0 disables it (default) — scan-on-startup and the admin endpoint are
# then the only ways to index new media.
app.media.scan-interval-minutes=${MEDIA_SCAN_INTERVAL_MINUTES:0}
# Skips trailers and sample clips that sit beside the feature. 0 disables.
app.media.min-file-size-mb=${MEDIA_MIN_FILE_SIZE_MB:50}
# Artwork uploaded through POST /api/media/admin/movies. Not a media library (this
# server has no business writing into somebody's movie folders, and a rescan would
# then treat the file as sidecar artwork it owns) and not the temp dir (a poster is
# content, not scratch space, and has to survive a reboot).
app.media.artwork-dir=${MEDIA_ARTWORK_DIR:data/artwork}
app.media.artwork-max-size-mb=10

# HLS scratch space. Wiped at startup and as sessions are reaped.
app.media.transcode-dir=${MEDIA_TRANSCODE_DIR:${java.io.tmpdir}/kido-transcode}
app.media.transcode-idle-timeout-seconds=120
# Each transcode saturates several cores, so keep this low on a home server.
app.media.max-transcode-sessions=2
app.media.transcode-crf=21
app.media.transcode-preset=veryfast
app.media.hls-segment-seconds=6
# VAAPI hardware transcode: off unless this host's /dev/dri is bind-mounted in and its
# render node confirmed working — see MediaProperties#transcodeHwaccelEnabled.
app.media.transcode-hwaccel-enabled=${TRANSCODE_HWACCEL_ENABLED:false}
app.media.vaapi-device=${VAAPI_DEVICE:/dev/dri/renderD128}

# --- Watch parties ---
# Seats in a party, host included, when the client does not ask for a number.
# Set by upstream bandwidth, not by how many friends someone has: every seat is
# an independent stream off this machine.
#
#   40 Mbps up, minus headroom for the rest of the household   ~32 Mbps usable
#   a 1080p title here runs about                                 8 Mbps
#   so                                                          4 streams
#
# That is 4 total if the host is watching from outside the house, or 3 friends
# plus a host on the LAN, who costs no upstream at all. Raise it to 5 if the
# host always watches at home; drop it if the library is mostly high-bitrate
# remuxes, which are nearer 20 Mbps each and fit two.
#
# A title that has to be transcoded is capped harder by CPU than by bandwidth:
# max-transcode-sessions above is the real limit for those, whatever is set here.
app.parties.max-members=${PARTY_MAX_MEMBERS:4}
# Guest join attempts allowed per address per minute, which blunts code guessing.
app.parties.guest-join-attempts-per-minute=${PARTY_GUEST_ATTEMPTS:10}

# --- Public URL and app deep linking ---
# This server's own public address, for building a shareable watch-party link
# (PartyDto.shareUrl) and as the domain the two verification files below answer for.
# Blank (the default) means sharing stays code-only, exactly as it works today.
app.public-base-url=${PUBLIC_BASE_URL:}
# Android App Links / iOS Universal Links verification. All blank until the Tower app
# side supplies real identifiers, at which point /join/{code} opens the app directly
# instead of the web fallback page -- no further backend change needed once these are
# set. See DeepLinkController for what each is used for.
app.deeplink.android-package=${DEEPLINK_ANDROID_PACKAGE:}
app.deeplink.android-sha256-fingerprints=${DEEPLINK_ANDROID_SHA256:}
app.deeplink.ios-team-id=${DEEPLINK_IOS_TEAM_ID:}
app.deeplink.ios-bundle-id=${DEEPLINK_IOS_BUNDLE_ID:}
# Custom URL scheme (tower://join/{code}) tried alongside the verified web link --
# works without App/Universal Links being verified at all, at the cost of an "Open in
# app?" prompt every time instead of a silent handoff.
app.deeplink.custom-scheme=${DEEPLINK_CUSTOM_SCHEME:tower}

# --- Thumbnail scrubbing (sprite sheets) ---
# Generating these decodes the whole file, so it is opt-in and runs as an explicit
# background job rather than during a scan.
app.media.trickplay.enabled=${TRICKPLAY_ENABLED:false}
app.media.trickplay.interval-seconds=10
app.media.trickplay.tile-width=320
app.media.trickplay.columns=10
app.media.trickplay.rows=10
app.media.trickplay.quality=5
app.media.trickplay.cache-dir=${TRICKPLAY_DIR:${java.io.tmpdir}/kido-trickplay}
app.media.trickplay.timeout-minutes=30

# --- Example: the home server at 192.168.29.122 ---
# Set MEDIA_ROOTS, or replace these with typed libraries. Paths are as seen by the
# machine actually running this app, which should be the server itself: reading the
# disk over SMB from another box sends every byte across the LAN twice and makes
# seeking noticeably worse.
#
#   app.media.libraries[0].name=Films
#   app.media.libraries[0].path=E:/Entertainment/Movies
#   app.media.libraries[0].type=FILM
#   app.media.libraries[1].name=Anime
#   app.media.libraries[1].path=E:/Entertainment/Anime
#   app.media.libraries[1].type=ANIME
#   app.media.libraries[2].name=Ours
#   app.media.libraries[2].path=E:/Entertainment/Home Videos
#   app.media.libraries[2].type=HOME_VIDEO
#
# If the app does run elsewhere, a UNC path works too:
#   app.media.libraries[0].path=//192.168.29.122/Entertainment/Movies

# --- Offline downloads ---
# A copy is only re-encoded when the original will not do; a file the device can
# already play is handed over untouched. Conversions use a slower preset than live
# transcoding, since nothing waits on them frame-by-frame and a smaller file is the
# entire point when the destination is a phone.
app.media.downloads.enabled=${DOWNLOADS_ENABLED:true}
app.media.downloads.dir=${DOWNLOADS_DIR:${java.io.tmpdir}/kido-downloads}
app.media.downloads.retention-hours=72
app.media.downloads.max-queued-per-profile=5
app.media.downloads.preset=medium
app.media.downloads.crf=23
app.media.downloads.timeout-minutes=240
app.media.downloads.default-height=720

# --- Teaser shorts: curated vertical preview clips cut from a movie's own file ---
app.media.teasers.enabled=${TEASERS_ENABLED:true}
app.media.teasers.output-dir=${TEASER_CLIPS_DIR:data/teaser-clips}
app.media.teasers.min-clip-seconds=5
app.media.teasers.max-clip-seconds=30
app.media.teasers.output-width=720
app.media.teasers.output-height=1280
app.media.teasers.preset=fast
app.media.teasers.crf=22
app.media.teasers.max-bitrate-kbps=3000
app.media.teasers.timeout-minutes=10
app.media.teasers.default-horizontal-offset=0.0
app.media.teasers.publish-by-default=false

# --- Cast photos: fetched from TMDB and cached locally ---
app.media.cast-photos.enabled=${CAST_PHOTOS_ENABLED:true}
app.media.cast-photos.api-key=${TMDB_API_KEY:}
app.media.cast-photos.cache-dir=${CAST_PHOTOS_DIR:data/cast-photos}
app.media.cast-photos.image-size=w300
app.media.cast-photos.timeout-seconds=8

# --- Music artwork: fallback album art for a track with none embedded ---
# Looked up against Apple's iTunes Search API, which needs no key/registration.
app.media.music-artwork.enabled=${MUSIC_ARTWORK_ENABLED:true}
app.media.music-artwork.timeout-seconds=8
app.media.music-artwork.min-request-interval-ms=3000

# --- Music previews: short audio clips, generated on first request ---
app.media.music-preview.enabled=${MUSIC_PREVIEW_ENABLED:true}
app.media.music-preview.start-fraction=0.25
app.media.music-preview.clip-seconds=20
app.media.music-preview.cache-dir=${MUSIC_PREVIEW_DIR:data/music-previews}
app.media.music-preview.timeout-seconds=15

# --- Search: the model fallback ---
# The search box parses sentences itself — "Tamil films under 2 hours rated over 8" —
# against this library's own genres, cast names and languages. That needs no account and
# works offline, and it handles most of what people actually type.
#
# With this on, a sentence the rules read nothing at all in is handed to Claude, which
# answers with the same filter object the rules produce and never sees the database. Off
# by default: a home media server must not need somebody else's service to search a disk
# it already has. Unset key means off whatever this says, and any failure — outage,
# timeout, refusal — simply serves what the rules understood.
app.media.ai.enabled=${AI_SEARCH_ENABLED:false}
app.media.ai.api-key=${ANTHROPIC_API_KEY:}
app.media.ai.model=${AI_SEARCH_MODEL:claude-opus-5}
# A short translation into a schema, not a problem — and a search box is where latency
# is felt. Raise it only if a library's vocabulary turns out to need it.
app.media.ai.effort=${AI_SEARCH_EFFORT:low}
app.media.ai.timeout=8s
# Households ask the same question repeatedly; the answer only changes when a scan
# changes the vocabulary.
app.media.ai.cache-size=200

# The assistant: ask a question about the library in your own words. A separate switch
# from the search fallback above because they are different bargains — that is one short
# call on a sentence the rules could not read, this is a loop that may call tools several
# times per question. Its tools are read-only and scoped to whoever is asking; there is
# no tool that can delete, purge or play anything.
app.media.ai.assistant-enabled=${AI_ASSISTANT_ENABLED:false}
app.media.ai.assistant-timeout=60s

# --- Ceremony poster creator ---
# The catalog is generated into an empty database on first start, so the module answers
# with something before anyone has authored anything. It never re-seeds: delete a
# template and it stays deleted.
app.poster.seed-samples=${POSTER_SEED_SAMPLES:true}
# How many templates that first seed writes, spread evenly over the seven ceremonies.
# They are generated from 7 ceremonies x 18 designs x 10 palettes, so anything up to
# 1260 is a distinct design and past that the combinations repeat under new names.
app.poster.seed-count=${POSTER_SEED_COUNT:1000}
# Where the fonts, stickers and thumbnails the seeded catalog points at actually live.
# This server does not host them — point this at your own bucket, or turn the seeding
# off above and publish templates with real URLs through POST /api/poster/templates.
app.poster.asset-base-url=${POSTER_ASSET_BASE_URL:https://assets.kiduu.app/poster}
