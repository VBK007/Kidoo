# Integration tests run against an in-memory H2 database (PostgreSQL compatibility
# mode), so the real JPA/Hibernate persistence layer is exercised end-to-end.
spring.datasource.url=jdbc:h2:mem:kido;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-0123456789-0123456789-0123456789-abcdefghij
app.jwt.expiration-ms=3600000

spring.jackson.deserialization.fail-on-null-for-primitives=false

app.admin.api-key=test-admin-key
app.billing.verify=dev

# The media module is dormant in tests: no libraries configured, so no disk is
# touched and no ffmpeg/ffprobe binary is required for the suite to pass. The
# streaming test overrides app.media.roots via @DynamicPropertySource.
app.media.roots=
app.media.probe-on-scan=false
app.media.scan-on-startup=false
app.media.transcode-dir=${java.io.tmpdir}/kido-transcode-test
app.media.trickplay.enabled=false
app.media.trickplay.cache-dir=${java.io.tmpdir}/kido-trickplay-test
app.media.downloads.dir=${java.io.tmpdir}/kido-downloads-test
app.media.downloads.timeout-minutes=1

# Watch party guests: the throttle exists to blunt code guessing, and a suite that
# hammers the endpoint from one address would otherwise throttle itself. Its own
# behaviour is covered by a unit test instead.
app.parties.guest-join-attempts-per-minute=100000
